<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Maker – Test Page</title>
  <style>
    :root { --bg:#f7f7f8; --fg:#1d1d1f; --card:#fff; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --card:#1c1c1e; --accent:#60a5fa; } }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg);
           display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
    .card { background:var(--card); border-radius:12px; padding:32px; max-width:480px; width:100%;
            box-shadow:0 4px 20px rgba(0,0,0,.08); text-align:center; }
    h1 { margin-top:0; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 20px; font-size:16px; cursor:pointer; }
    #out { margin-top:16px; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>QA Maker 🚀</h1>
    <p>Trang test GitHub Pages hoạt động!</p>
    <button id="btn">Bấm thử</button>
    <div id="out"></div>
  </div>
  <script>
    let n = 0;
    document.getElementById('btn').onclick = () => {
      n++;
      document.getElementById('out').textContent = 'Đã bấm ' + n + ' lần • ' + new Date().toLocaleTimeString();
    };
  </script>
</body>
</html>
